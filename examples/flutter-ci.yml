# Opt-in example, not installed automatically. Pin reviewed action SHAs before use.
name: Flutter checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Install a reviewed, pinned Flutter SDK action here, e.g. subosito/flutter-action.
      # The SDK version must match your target repository.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
# Deliberately incomplete SDK setup; use your existing Flutter CI if available.
