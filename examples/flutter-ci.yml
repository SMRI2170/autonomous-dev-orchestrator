# Copy manually to a PUBLIC Flutter target only after reviewing its CI behavior.
# Replace both placeholders. No deployment, secrets or self-hosted runner.
name: Flutter checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    uses: SMRI2170/autonomous-dev-orchestrator/.github/workflows/reusable-flutter.yml@<REVIEWED_COMMIT_SHA>
    with:
      flutter-version: '<YOUR_EXACT_FLUTTER_VERSION>'
    permissions:
      contents: read
# required_checks must use the actual resulting GitHub check name (e.g. checks / flutter).
