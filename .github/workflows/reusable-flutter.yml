name: Reusable Flutter checks
on:
  workflow_call:
    inputs:
      flutter-version:
        description: Exact stable Flutter SDK version used by the caller
        required: true
        type: string
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate explicit SDK version
        env:
          FLUTTER_VERSION: ${{ inputs.flutter-version }}
        shell: bash
        run: '[[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
