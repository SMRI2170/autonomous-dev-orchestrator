[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-dev-orchestrator"
version = "0.1.0"
description = "Fail-closed, single-job GitHub development orchestration for a local Mac"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ado = "ado.cli:main"

[tool.setuptools]
packages = ["ado"]
